<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="cyanTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4cc9f0" />
    </linearGradient>
    <linearGradient id="magentaPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3366" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>
    <linearGradient id="goldGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff88" />
      <stop offset="100%" stop-color="#ffcc00" />
    </linearGradient>
    
    <!-- Glow Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glowPink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Hexagon Outer Boundary (High-Tech Grid Shield) -->
  <polygon points="256,30 450,142 450,370 256,482 62,370 62,142" 
           fill="none" 
           stroke="url(#cyanTeal)" 
           stroke-width="16" 
           stroke-linejoin="round"
           filter="url(#glowCyan)"
           opacity="0.85" />
           
  <!-- Inner Dashed Hexagon (Tactical Radar overlay) -->
  <polygon points="256,70 410,158 410,354 256,442 102,354 102,158" 
           fill="none" 
           stroke="url(#cyanTeal)" 
           stroke-width="4" 
           stroke-dasharray="16, 12"
           stroke-linejoin="round"
           opacity="0.5" />

  <!-- Defense Tower/Apex (Central Delta Wing/Tower) -->
  <path d="M256,90 L390,360 L310,360 L256,220 L202,360 L122,360 Z" 
        fill="url(#magentaPink)" 
        stroke="#ffffff"
        stroke-width="3"
        filter="url(#glowPink)"
        stroke-linejoin="round" />

  <!-- Central Core / Energy Node -->
  <circle cx="256" cy="270" r="32" 
          fill="#ffffff" 
          stroke="url(#goldGreen)" 
          stroke-width="8" 
          filter="url(#glowCyan)" />

  <!-- Outer Defensive Satellite Orbits / Accents -->
  <circle cx="256" cy="30" r="12" fill="#00ff88" />
  <circle cx="450" cy="142" r="12" fill="#00f2fe" />
  <circle cx="450" cy="370" r="12" fill="#ff3366" />
  <circle cx="256" cy="482" r="12" fill="#00ff88" />
  <circle cx="62" cy="370" r="12" fill="#ff3366" />
  <circle cx="62" cy="142" r="12" fill="#00f2fe" />

  <!-- Target Crosshairs lines representing targeting/defense -->
  <line x1="256" y1="120" x2="256" y2="180" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <line x1="180" y1="270" x2="210" y2="270" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <line x1="302" y1="270" x2="332" y2="270" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
</svg>
