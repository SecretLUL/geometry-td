<!-- Settings Tab -->
<div id="tab-settings" class="tab-content-wrapper hidden">
  <div class="settings-list">
    <!-- Sound Volume -->
    <div class="settings-card">
      <div class="settings-info">
        <div class="settings-label-container">
          <svg
            class="settings-icon"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#4cc9f0"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path
              d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"
            ></path>
          </svg>
          <label for="soundVolume">Sound-Lautstärke</label>
        </div>
        <span class="settings-desc">Effekte, Schüsse und Explosionen</span>
      </div>
      <div class="settings-control">
        <input
          type="range"
          id="soundVolume"
          class="ig-range-slider"
          min="0"
          max="100"
          value="50"
        />
      </div>
    </div>

    <!-- Music Volume -->
    <div class="settings-card">
      <div class="settings-info">
        <div class="settings-label-container">
          <svg
            class="settings-icon"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#4cc9f0"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M9 18V5l12-2v13"></path>
            <circle cx="6" cy="18" r="3"></circle>
            <circle cx="18" cy="16" r="3"></circle>
          </svg>
          <label for="musicVolume">Musik-Lautstärke</label>
        </div>
        <span class="settings-desc">Hintergrund-Synthwave-Tracks</span>
      </div>
      <div class="settings-control">
        <input
          type="range"
          id="musicVolume"
          class="ig-range-slider"
          min="0"
          max="100"
          value="50"
        />
      </div>
    </div>

    <!-- Performance Mode -->
    <div class="settings-card">
      <div class="settings-info">
        <div class="settings-label-container">
          <svg
            class="settings-icon"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#4cc9f0"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
            <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
          </svg>
          <label for="perfModeToggle">Performance-Modus</label>
        </div>
        <span class="settings-desc"
          >Reduziert auf 30 FPS für niedrigen Energieverbrauch</span
        >
      </div>
      <div class="settings-control">
        <label class="ig-switch">
          <input type="checkbox" id="perfModeToggle" />
          <span class="ig-switch-slider"></span>
        </label>
      </div>
    </div>

    <!-- FPS Display -->
    <div class="settings-card">
      <div class="settings-info">
        <div class="settings-label-container">
          <svg
            class="settings-icon"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#4cc9f0"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M12 20v-6M6 20V10M18 20V4"></path>
          </svg>
          <label for="fpsToggle">FPS-Anzeige</label>
        </div>
        <span class="settings-desc">Blendet die FPS-Anzeige in der Menüecke ein</span>
      </div>
      <div class="settings-control">
        <label class="ig-switch">
          <input type="checkbox" id="fpsToggle" />
          <span class="ig-switch-slider"></span>
        </label>
      </div>
    </div>

    <!-- Refresh Rate -->
    <div class="settings-card">
      <div class="settings-info">
        <div class="settings-label-container">
          <svg
            class="settings-icon"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#4cc9f0"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
            <line x1="8" y1="21" x2="16" y2="21"></line>
            <line x1="12" y1="17" x2="12" y2="21"></line>
          </svg>
          <label for="refreshRateSelect">Bildwiederholrate</label>
        </div>
        <span class="settings-desc">Passt die Spielphysik an deinen Monitor an</span>
      </div>
      <div class="settings-control">
        <select id="refreshRateSelect" class="ig-select">
          <option value="60">60 Hz (Standard)</option>
          <option value="90">90 Hz</option>
          <option value="120">120 Hz</option>
          <option value="144">144 Hz</option>
          <option value="165">165 Hz</option>
          <option value="uncapped">unbegrenzt</option>
        </select>
      </div>
    </div>
  </div>
</div>
