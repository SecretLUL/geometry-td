<!-- ── Start Screen / Splash Screen (Autoplay Bypass & Entry) ── -->
<div id="splash-screen" class="splash-screen">
  <div class="splash-content">
    <div class="geometric-portal-wrapper">
      <div class="portal-ring outer-ring"></div>
      <div class="portal-ring middle-ring"></div>
      <div class="portal-ring inner-ring"></div>
      <div class="portal-core">
        <div class="core-shape geometry-diamond"></div>
      </div>
    </div>

    <div class="splash-action-container">
      <div class="button-corner corner-tl"></div>
      <div class="button-corner corner-tr"></div>
      <div class="button-corner corner-bl"></div>
      <div class="button-corner corner-br"></div>
      <button id="splash-enter-btn" class="splash-enter-btn glitch-hover">
        <span class="btn-text">SIMULATION INITIALISIEREN</span>
      </button>
    </div>

    <span class="splash-instructions">KLICKE ODER DRÜCKE [ENTER] ZUM STARTEN</span>
  </div>
  <div class="splash-footer">
    <span id="splash-env-label">SECURE-CONNECTION // HOST: DEV-ENVIRONMENT</span>
  </div>
</div>
